# Local development database only. The application API and Vite frontend run from source.
services:
  mongodb:
    image: mongo:7.0
    container_name: question-paper-scrutiny-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
